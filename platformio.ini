[env:stickcplus2]
; Exact versions: a build changes only when this file does. Check Espressif security advisories when bumping.
platform = espressif32@6.13.0
; PlatformIO has no Plus2 board; M5Unified detects the real model at runtime.
board = m5stick-c
framework = arduino
; 8 MB with two app slots: an update over Wi-Fi needs a free slot, and the old firmware stays for a rollback.
board_upload.flash_size = 8MB
board_upload.maximum_size = 8388608
board_build.partitions = default_8MB.csv
; Public keys the firmware checks signatures with (see sign-release.sh and the bridge).
board_build.embed_txtfiles =
  keys/release-public.pem
  keys/feed-public.pem
; Tektur, the interface font (fonts/OFL.txt), built by tools/make-fonts.py.
board_build.embed_files =
  fonts/t11.vlw
  fonts/t14.vlw
  fonts/t18.vlw
  fonts/t24.vlw
  fonts/t32.vlw
  fonts/t44.vlw
lib_deps =
  m5stack/M5Unified@0.2.29
  m5stack/M5GFX@0.2.36
monitor_speed = 115200
