[env:stickcplus2]
platform = espressif32@^6.9.0
; PlatformIO has no Plus2 board; M5Unified detects the real model at runtime.
board = m5stick-c
framework = arduino
; 8 MB with two app slots: an update over Wi-Fi needs a free slot, and the old firmware stays for a rollback.
board_upload.flash_size = 8MB
board_upload.maximum_size = 8388608
board_build.partitions = default_8MB.csv
lib_deps = m5stack/M5Unified@^0.2.7
monitor_speed = 115200
