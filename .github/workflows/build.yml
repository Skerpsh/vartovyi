name: build

# Every push is tested and built. A tag like v1.2.0 also makes a release and updates the web installer.
# A release takes effect only once the owner signs it (sign-release.sh): servers and sticks refuse it until then.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions: {}  # each job asks only for what it needs

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: '3.12'
      # No cache: a release must build from scratch, never from files another run left behind.
      - run: pip install platformio==6.2.0 cryptography==50.0.2 esptool==4.8.1
      - name: Tests
        run: |
          g++ -std=c++17 -I src test/test_alert.cpp -o test-alert && ./test-alert
          python test/test_bridge.py
      - name: Firmware
        env:  # the stick shows it in Settings
          PLATFORMIO_BUILD_FLAGS: -DVERSION='"${{ github.ref_type == 'tag' && github.ref_name || 'dev' }}"'
        run: |
          pio run
          B=.pio/build/stickcplus2
          mkdir -p out
          cp $B/firmware.bin out/firmware.bin
          # One image from offset 0 for the web installer: bootloader, partitions, OTA data, app.
          python -m esptool --chip esp32 merge_bin -o out/vartovyi-full.bin --flash_mode dio --flash_size 8MB \
            0x1000 $B/bootloader.bin 0x8000 $B/partitions.bin \
            0xe000 ~/.platformio/packages/framework-arduinoespressif32/tools/partitions/boot_app0.bin \
            0x10000 $B/firmware.bin
          tar -C vps -czf out/server.tar.gz peace_bridge.py regions.json peace-stick-bridge.service install.sh add-caddy-routes.sh \
            update.sh vartovyi-update.service vartovyi-update.timer webhook-public.pem -C ../keys release-public.pem
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: vartovyi
          path: out/
      - name: Web installer
        if: github.ref_type == 'tag'
        env:  # served from the site itself, checked against the hash npm published for this version
          EWT_URL: https://registry.npmjs.org/esp-web-tools/-/esp-web-tools-10.4.0.tgz
          EWT_INTEGRITY: sha512-3pwkeFFm5Fj7UQo8SJNYK5RXrtNCpq6X9QoI6bMT4GBZWgrJqjn0YvM9ihG74BtMoSFYXfmDtkehuxe50PTMPQ==
        run: |
          mkdir site ewt
          curl -fsSL -o ewt.tgz "$EWT_URL"
          [ "sha512-$(openssl dgst -sha512 -binary ewt.tgz | base64 -w0)" = "$EWT_INTEGRITY" ] || { echo 'esp-web-tools hash mismatch'; exit 1; }
          tar -xzf ewt.tgz -C ewt
          cp -r ewt/package/dist/web site/esp-web-tools
          cp web/index.html out/vartovyi-full.bin site/
          sed "s/VERSION/$GITHUB_REF_NAME/" web/manifest.json >site/manifest.json
      - if: github.ref_type == 'tag'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa  # v3.0.1
        with:
          path: site

  release:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: vartovyi
          path: out
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" out/firmware.bin out/vartovyi-full.bin out/server.tar.gz --generate-notes

  pages:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e  # v4.0.5
